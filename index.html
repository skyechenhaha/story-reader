<title>阅读</title>
<script>try{var t=localStorage.getItem('story_reader_theme');if(t&&t!=='light')document.documentElement.className=t}catch(e){}</script>
<style>
:root{--bg:#fbfaf7;--fg:#1f1f1f;--sub:#8a8a8a;--line:#e6e2da;--acc:#7a5c3e;--fs:19px}
html.dark{--bg:#15161a;--fg:#cfcfcf;--sub:#777;--line:#2a2b30;--acc:#c9a77c}
html.sepia{--bg:#f4ecd8;--fg:#3b2f22;--sub:#8c7a62;--line:#e0d3b5;--acc:#8a5a2b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",serif;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding:0 20px calc(90px + env(safe-area-inset-bottom))}
#lock{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
#lock h1{font-size:22px;font-weight:600;margin:0 0 22px;letter-spacing:2px}
#lock input{width:100%;max-width:300px;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--fg);text-align:center;outline:none}
#lock button,.bar button,.nav button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:10px 16px;font-size:15px}
#lock button{margin-top:14px;width:100%;max-width:300px;background:var(--acc);color:#fff;border:none;font-size:17px}
#lock label{margin-top:14px;font-size:14px;color:var(--sub)}
#msg{margin-top:12px;font-size:14px;color:#c0392b;min-height:20px}
#app{display:none}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
header .in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-size:14px;color:var(--sub)}
header .t{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
header button{font:inherit;font-size:14px;background:none;border:none;color:var(--sub);padding:6px}
h2.ct{font-size:calc(var(--fs) + 5px);text-align:center;margin:36px 0 30px;font-weight:600;letter-spacing:1px}
#content p{font-size:var(--fs);line-height:1.9;margin:0 0 .8em;text-indent:2em;text-align:justify;word-break:break-all}
#content h3.sh{font-size:calc(var(--fs) + 1px);margin:1.4em 0 .6em;font-weight:600;color:var(--acc)}
#content p.li{text-indent:0;padding-left:1em;text-indent:-1em}
#content p.sep{text-indent:0;text-align:center;color:var(--sub);margin:1.6em 0}
.nav{display:flex;gap:12px;margin:40px 0 10px}
.nav button{flex:1;padding:14px}
.nav button:disabled{opacity:.35}
#toc{display:none}
#toc h2{font-size:20px;margin:28px 0 16px;text-align:center}
#toc a{display:flex;justify-content:space-between;padding:16px 4px;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:17px}
#toc a span{color:var(--sub);font-size:13px}
.panel{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom));display:none;z-index:9;box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.panel .row{display:flex;align-items:center;gap:10px;max-width:680px;margin:6px auto}
.panel .row span{width:44px;color:var(--sub);font-size:14px}
.panel .row button{flex:1}
.panel .row button.on{border-color:var(--acc);color:var(--acc)}
#prog{position:fixed;top:0;left:0;height:2px;background:var(--acc);width:0;z-index:10}
</style>
</head>
<body>
<div id="lock">
  <h1>请输入阅读密码</h1>
  <input id="pw" type="password" autocomplete="current-password" placeholder="密码" enterkeyhint="go">
  <button id="go">进入</button>
  <label><input type="checkbox" id="rem" checked> 在本设备上记住</label>
  <div id="msg"></div>
</div>
<div id="app">
  <div id="prog"></div>
  <header><div class="in"><button id="btoc">目录</button><div class="t" id="htitle"></div><button id="bset">设置</button></div></header>
  <div class="wrap">
    <div id="toc"></div>
    <div id="reader"><h2 class="ct" id="ctitle"></h2><div id="content"></div>
      <div class="nav"><button id="prev">上一章</button><button id="next">下一章</button></div></div>
  </div>
  <div class="panel" id="panel">
    <div class="row"><span>字号</span><button id="fsm">A−</button><button id="fsp">A+</button></div>
    <div class="row"><span>背景</span><button data-th="light">白天</button><button data-th="sepia">护眼</button><button data-th="dark">夜间</button></div>
    <div class="row"><span></span><button id="lockbtn">退出（清除本机密码）</button></div>
  </div>
</div>

(function(){
var LS=window.localStorage, K='story_reader_', book=null, cur=0, saveT=null;
function g(k,d){try{var v=LS.getItem(K+k);return v===null?d:v}catch(e){return d}}
function s(k,v){try{LS.setItem(K+k,v)}catch(e){}}
function del(k){try{LS.removeItem(K+k)}catch(e){}}
function b64(x){var b=atob(x),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function tob64(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
var $=function(id){return document.getElementById(id)};
var msg=$('msg');
if(!(window.crypto&&crypto.subtle)){msg.textContent='当前浏览器不支持解密，请用 https 链接打开，或换用系统浏览器。';}
function derive(pw){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']).then(function(base){
    return crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:'SHA-256'},base,256);
  });
}
function decrypt(raw){
  return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']).then(function(key){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.ct));
  }).then(function(buf){return JSON.parse(new TextDecoder().decode(buf))});
}
function unlock(raw,remember){
  return decrypt(raw).then(function(data){
    if(remember)s('key_'+PAYLOAD.v,tob64(raw));
    book=data;start();
  });
}
function tryPw(){
  var pw=$('pw').value.trim(); if(!pw)return;
  msg.style.color='';msg.textContent='解密中…';
  derive(pw).then(function(raw){return unlock(raw,$('rem').checked)}).catch(function(){msg.textContent='密码不对，请再试一次。'});
}
$('go').onclick=tryPw;
$('pw').onkeydown=function(e){if(e.key==='Enter'||e.keyCode===13)tryPw()};
var saved=g('key_'+PAYLOAD.v,null);
if(saved&&window.crypto&&crypto.subtle){unlock(b64(saved),true).catch(function(){del('key_'+PAYLOAD.v)})}

function esc(t){return t.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function start(){
  $('lock').style.display='none';$('app').style.display='block';
  document.title=book.title;
  applyTheme(g('theme','light'));applyFs(+g('fs',19));
  var h='<h2>'+esc(book.title)+'</h2>';
  book.chapters.forEach(function(c,i){h+='<a href="#c'+(i+1)+'" data-i="'+i+'">'+esc(c.title)+'<span>'+c.n+'字</span></a>'});
  $('toc').innerHTML=h;
  var m=location.hash.match(/^#c(\d+)$/);
  if(m)show(+m[1]-1,0);else if(g('pos',null)){var p=g('pos','0:0').split(':');show(+p[0],+p[1])}else showToc();
}
function showToc(){$('toc').style.display='block';$('reader').style.display='none';$('htitle').textContent=book.title;window.scrollTo(0,0)}
function show(i,frac){
  if(i<0||i>=book.chapters.length)i=0;
  cur=i;var c=book.chapters[i];
  $('toc').style.display='none';$('reader').style.display='block';
  $('ctitle').textContent=c.title;$('htitle').textContent=c.title;
  $('content').innerHTML=c.paras.map(function(p){return p==='***'?'<p class="sep">＊　＊　＊</p>':p.charAt(0)==='§'?'<h3 class="sh">'+esc(p.slice(1))+'</h3>':p.slice(0,2)==='• '?'<p class="li">'+esc(p)+'</p>':'<p>'+esc(p)+'</p>'}).join('');
  $('prev').disabled=i===0;$('next').disabled=i===book.chapters.length-1;
  if(location.hash!=='#c'+(i+1))history.replaceState(null,'','#c'+(i+1));
  requestAnimationFrame(function(){window.scrollTo(0,frac?frac*(document.documentElement.scrollHeight-innerHeight):0);savePos()});
}
function savePos(){
  if(!book||$('reader').style.display==='none')return;
  var H=document.documentElement.scrollHeight-innerHeight, f=H>0?Math.min(1,scrollY/H):0;
  $('prog').style.width=(f*100)+'%';
  s('pos',cur+':'+f.toFixed(4));
}
window.addEventListener('scroll',function(){clearTimeout(saveT);saveT=setTimeout(savePos,150)},{passive:true});
window.addEventListener('pagehide',savePos);
document.addEventListener('visibilitychange',function(){if(document.hidden)savePos()});
window.addEventListener('hashchange',function(){var m=location.hash.match(/^#c(\d+)$/);if(m&&book&&+m[1]-1!==cur)show(+m[1]-1,0)});
$('toc').onclick=function(e){var a=e.target.closest('a');if(a){e.preventDefault();show(+a.getAttribute('data-i'),0)}};
$('btoc').onclick=function(){$('panel').style.display='none';showToc()};
$('prev').onclick=function(){show(cur-1,0)};$('next').onclick=function(){show(cur+1,0)};
$('bset').onclick=function(){var p=$('panel');p.style.display=p.style.display==='block'?'none':'block'};
$('content').onclick=function(){$('panel').style.display='none'};
function applyFs(v){v=Math.max(14,Math.min(28,v));document.documentElement.style.setProperty('--fs',v+'px');s('fs',v)}
$('fsm').onclick=function(){applyFs(+g('fs',19)-1)};$('fsp').onclick=function(){applyFs(+g('fs',19)+1)};
function applyTheme(t){document.documentElement.className=t==='light'?'':t;s('theme',t);
  [].forEach.call(document.querySelectorAll('[data-th]'),function(b){b.className=b.getAttribute('data-th')===t?'on':''})}
[].forEach.call(document.querySelectorAll('[data-th]'),function(b){b.onclick=function(){applyTheme(b.getAttribute('data-th'))}});
$('lockbtn').onclick=function(){del('key_'+PAYLOAD.v);location.hash='';location.reload()};
})();
</script>
